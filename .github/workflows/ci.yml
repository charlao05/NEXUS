name: NEXUS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Dependencias de TESTE agora sao declaradas (requirements-dev.txt),
          # nao assumidas. Instalar so "pytest httpx" fazia a suite passar na
          # maquina do dev e falhar aqui por falta de pytest-asyncio.
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret-key-do-not-use-in-prod
          ENVIRONMENT: test
        run: python -m pytest tests/ -v --tb=short

  security-tests:
    name: Security Tests (Shannon Framework)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run security tests
        env:
          JWT_SECRET: ci-test-secret-key-do-not-use-in-prod
          ENVIRONMENT: test
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/security/ -v --tb=short

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: logs/security_report_*.json
          retention-days: 30
          if-no-files-found: ignore

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint, security-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build and run E2E tests
        env:
          JWT_SECRET: ci-test-secret-key-do-not-use-in-prod
          ENVIRONMENT: test
        run: |
          docker compose --profile test up --build --abort-on-container-exit --exit-code-from e2e
        timeout-minutes: 10

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results/
          retention-days: 7

