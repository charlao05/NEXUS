# Configuracao do pytest — criada em 26/07/2026.
#
# asyncio_mode = auto: sem isto, todo teste `async def` precisa do decorador
# @pytest.mark.asyncio explicito. Quatro testes de test_gov_integrations.py nao
# o tinham e falhavam no CI com "async def functions are not natively
# supported" — enquanto passavam nas maquinas de desenvolvimento, onde a
# configuracao do pytest-asyncio instalado era diferente.
#
# Declarar o modo aqui torna o comportamento IGUAL em qualquer ambiente, que e
# o ponto: a suite so vale se o resultado for o mesmo no CI e na maquina.
[pytest]
asyncio_mode = auto
testpaths = tests
