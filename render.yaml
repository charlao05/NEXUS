services:
  # -- Backend API --
  - type: web
    name: nexus-backend
    env: python
    plan: free
    region: ohio
    rootDir: backend
    runtime: python
    # Schema criado no startup (runtime), não no build — ver main.py on_startup.
    # playwright é não-fatal: se falhar (Módulo B/browser), o build segue.
    # PLAYWRIGHT_BROWSERS_PATH (envVars abaixo) manda o chromium para dentro
    # do projeto. Sem isso ele ia para ~/.cache/ms-playwright, que NAO faz
    # parte do artefato deployado — build e runtime sao containers distintos
    # no Render, entao o browser era baixado e descartado. Era essa a causa
    # de config.automacao_web.disponivel = false em producao.
    # O `|| true` fica: nao derrubar o deploy inteiro por causa do browser.
    # A falha continua VISIVEL via /health (config_check.browser_disponivel).
    buildCommand: pip install -r requirements.txt && (playwright install chromium || true)
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ESSENCIAL
        sync: false
      - key: STRIPE_PRICE_PROFISSIONAL
        sync: false
      - key: STRIPE_PRICE_COMPLETO
        sync: false
      - key: FRONTEND_URL
        value: "https://app.nexxusapp.com.br"
      - key: CORS_ORIGINS
        value: "https://app.nexxusapp.com.br"
      - key: BACKEND_BASE_URL
        value: "https://api.nexxusapp.com.br"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: "production"
      # CRITICO: o valor tem de ser IDENTICO no build e no runtime — ate uma
      # barra final a mais conta como caminho diferente e o browser "some".
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/.cache/playwright"
      - key: NEXUS_VERSION
        value: "2.0.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "appnexusapp_bot"
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      # ── Declaradas em 30/07/2026 ────────────────────────────────────────
      # Todas existiam SO no painel do Render. Um reapply do blueprint
      # devolveria o servico ao estado quebrado — foi assim que o checkout
      # ficou fora do ar. sync:false mantem o VALOR apenas no painel; aqui
      # fica so a declaracao de que a variavel e necessaria.
      - key: STRIPE_PRICE_ESSENCIAL
        sync: false
      - key: STRIPE_PRICE_PROFISSIONAL
        sync: false
      - key: STRIPE_PRICE_COMPLETO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Regime tributario — MEI paga DAS FIXO, nao percentual (ver
      # app/core/tributacao.py). Sem isto, /margin responde 503 em producao.
      - key: TAX_REGIME
        sync: false
      - key: MEI_ATIVIDADE
        sync: false

  # -- Frontend SPA --
  - type: web
    name: nexus-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://api.nexxusapp.com.br"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_VERSION
        value: "18"

databases:
  # -- PostgreSQL (producao) --
  - name: nexus-db
    plan: free
    region: ohio
    databaseName: nexus
    user: nexus_user
    ipAllowList: []
